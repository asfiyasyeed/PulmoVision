<!DOCTYPE html>
<html>
<head>
    <title>Hospital Login - Pneumonia Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: #1c1c1c;">

    <!-- Top Accent Line -->
    <hr style="margin-top: 0px; opacity: 1;" color="#2a9d8f" size="8" width="100%"/>

    <div class="container d-flex justify-content-center align-items-center" style="height: 90vh;">

        <div class="card p-5 shadow" style="width: 400px; background-color: #242424; border-radius: 15px;">

            <h3 class="text-center mb-4" style="color: #2a9d8f;">
                Hospital Login
            </h3>

            <form method="POST" action="/login">

                <div class="mb-3">
                    <label class="form-label" style="color: #ccc;">Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" style="color: #ccc;">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>

                <button type="submit"
                        class="btn w-100"
                        style="background-color: #2a9d8f; color: white;">
                    Login
                </button>

            </form>

            {% if error %}
                <p class="text-danger text-center mt-3">{{ error }}</p>
            {% endif %}

        </div>

    </div>

</body>
</html>

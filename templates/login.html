<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hospital Login - Pneumonia Detection</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Gambarino&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink:   #1e1e1e;
            --peach: #ffd9cb;
            --mint:  #e1fdce;
            --cream: #f8f5f3;
        }

        html, body { height: 100%; }

        body {
            font-family: 'Gambarino', Georgia, serif;
            background: var(--cream);
            color: var(--ink);
            display: flex;
            min-height: 100vh;
        }

        /* ── Left panel ── */
        .left-col {
            width: 52%;
            background: var(--peach);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px 52px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative circles */
        .left-col::before {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            border: 1px solid rgba(30,30,30,0.1);
            bottom: -140px; right: -140px;
        }
        .left-col::after {
            content: '';
            position: absolute;
            width: 300px; height: 300px;
            border-radius: 50%;
            border: 1px solid rgba(30,30,30,0.07);
            bottom: -60px; right: -60px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-dot {
            width: 9px; height: 9px;
            background: var(--ink);
            border-radius: 50%;
        }
        .brand-name { font-size: 14px; letter-spacing: 0.05em; }

        /* Watermark */
        .watermark {
            position: fixed;
            bottom: 32px;
            right: 36px;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            opacity: 0.13;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            pointer-events: none;
            user-select: none;
            z-index: 0;
        }

        .left-hero {
            position: relative; z-index: 1;
        }
        .left-hero h1 {
            font-size: clamp(52px, 6vw, 88px);
            font-weight: 400;
            line-height: 1.06;
            letter-spacing: -0.025em;
        }
        .left-hero h1 em {
            font-style: italic;
            opacity: 0.45;
        }

        .mint-pill {
            display: inline-block;
            background: var(--mint);
            border-radius: 100px;
            padding: 6px 16px;
            font-size: 12px;
            letter-spacing: 0.05em;
            margin-top: 28px;
            opacity: 0.85;
        }

        .left-footer {
            font-size: 12px;
            opacity: 0.4;
            letter-spacing: 0.05em;
            position: relative; z-index: 1;
        }

        /* ── Right panel ── */
        .right-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 56px;
            background: var(--cream);
        }

        .login-box {
            width: 100%;
            max-width: 340px;
        }

        .login-eyebrow {
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 24px;
        }

        .login-title {
            font-size: 38px;
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.12;
            margin-bottom: 40px;
        }
        .login-title em { font-style: italic; opacity: 0.45; }

        /* Form */
        .form-row { margin-bottom: 18px; }
        .form-row label {
            display: block;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 8px;
        }
        .form-row input {
            width: 100%;
            background: var(--peach);
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 14px 18px;
            font-family: 'Gambarino', Georgia, serif;
            font-size: 16px;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-row input::placeholder { color: rgba(30,30,30,0.28); }
        .form-row input:focus {
            border-color: rgba(30,30,30,0.22);
            box-shadow: 0 0 0 3px rgba(30,30,30,0.05);
        }

        .btn-login {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            background: var(--ink);
            color: var(--cream);
            border: none;
            border-radius: 10px;
            font-family: 'Gambarino', Georgia, serif;
            font-size: 17px;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn-login:hover { opacity: 0.85; transform: translateY(-1px); }

        .error-msg {
            margin-top: 16px;
            background: rgba(200,60,60,0.07);
            border: 1px solid rgba(200,60,60,0.18);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: #a03030;
        }

        .login-note {
            margin-top: 32px;
            font-size: 12px;
            opacity: 0.3;
            text-align: center;
        }

        @media (max-width: 760px) {
            body { flex-direction: column; }
            .left-col { width: 100%; padding: 40px 28px 48px; }
            .left-hero h1 { font-size: 48px; }
            .right-col { padding: 40px 28px 60px; }
        }
    </style>
</head>
<body>

    <!-- Left decorative panel -->
    <div class="left-col">
        <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">PulmoVision</span>
        </div>

        <div class="left-hero">
            <h1>Pulmo<em>Vision</em></h1>
            <div class="mint-pill">Authorized Personnel Only</div>
        </div>

        <div class="left-footer">PulmoVision · Deep Learning · Classification</div>
    </div>

    <!-- Right login panel -->
    <div class="right-col">
        <div class="login-box">
            <div class="login-eyebrow">Sign in to continue</div>
            <div class="login-title">Welcome<br><em>back</em></div>

            <form method="POST" action="/login">
                <div class="form-row">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="Your username" required autocomplete="username">
                </div>
                <div class="form-row">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">Login</button>
            </form>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <div class="login-note">Hospital use only · All sessions are logged</div>
        </div>
    </div>

    <div class="watermark">PulmoVision</div>

</body>
</html>

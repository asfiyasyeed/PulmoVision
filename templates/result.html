<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: #242424;">

    <hr style="margin-top: 0px; opacity: 1;" color="#2a9d8f" size="8" width="100%"/>

    <div class="container text-center mt-5">

        <h2 style="color: #2a9d8f;">Prediction Result</h2>

        <div class="card p-4 mt-4 mx-auto"
             style="width: 450px; background-color: #1f1f1f; border-radius: 15px;">

            <h4 style="color: #fff;">
                Diagnosis: {{ prediction }}
            </h4>

            <p style="color: #ccc;">
                Confidence: {{ confidence }}%
            </p>

            <div class="mt-3">
                <img src="{{ imagePath }}"
                     class="img-fluid rounded"
                     style="max-width: 300px;">
            </div>

            <a href="/dashboard" class="btn mt-4"
               style="background-color: #2a9d8f; color: white;">
                Analyze Another Image
            </a>

        </div>

    </div>

</body>
</html>
